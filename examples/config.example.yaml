# Example run configuration — SECRET-FREE TEMPLATE (SYNTHETIC EXAMPLE)
#
# Copy this file, adjust the paths if needed, and export the referenced
# environment variables before running stages. Secret values live only in
# the environment; this file records variable NAMES, never values.
#
#   export MAPPER_BASE_URL=...        MAPPER_MODEL=...        MAPPER_API_KEY=...
#   export SCENARIO_BASE_URL=...      SCENARIO_MODEL=...      SCENARIO_API_KEY=...
#   export ARTIFACT_BASE_URL=...      ARTIFACT_MODEL=...      ARTIFACT_API_KEY=...
#   export TARGET_BASE_URL=...        TARGET_MODEL=...        TARGET_API_KEY=...
#   export JUDGE_BASE_URL=...         JUDGE_MODEL=...         JUDGE_API_KEY=...
#
# A shared target/judge model is acceptable for a smoke run and is recorded
# as a lack of independent validation, not hidden.

schema_version: 1

run:
  label: synthetic-support-assistant-smoke
  operator: example-operator
  # Is the subject already built, or a proposed design?
  #   built    - the system exists and can be evaluated end to end
  #              (requires target and judge connections)
  #   proposed - a design description only: the run stops after the
  #              Scenario Generator and reports the threat picture for
  #              the design; no target/judge credentials needed
  subject: built

policy:
  documents:
    - path: policy/synthetic-support-assistant-policy.md

system:
  use_case_file: system/use-case.md
  # OPTIONAL: capability profile and qualification facts. Omit them to run
  # with only what you supply — the Scenario Generator then performs its
  # own Stage-1 inference (an inferred-only run can finish with zero
  # scenarios when required architecture evidence is missing). An agent may
  # offer to draft these for your review; never include them unreviewed.
  profile_file: system/capability-profile.yaml
  qualification_facts_file: system/qualification-facts.yaml
  identity:
    system_name: ExampleCorp Support Assistant (synthetic)
    boundary: >-
      Assessed boundary is the assistant's OpenAI-compatible Chat
      Completions endpoint; the model, any guardrails and the agent harness
      behind it are observed only through that endpoint. SYNTHETIC EXAMPLE.
    endpoint_identity: example-support-assistant (synthetic)
    confirmed_by:
      actor: example-operator
      date: '2026-11-12'

sssom:
  # Mapper-pinned risk-to-category mapping (IBM risk atlas -> OWASP LLM).
  path: mappings/risk_to_category.sssom.tsv

connections:
  mapper_llm:
    base_url_env: MAPPER_BASE_URL
    model_env: MAPPER_MODEL
    api_key_env: MAPPER_API_KEY
  scenario_llm:
    base_url_env: SCENARIO_BASE_URL
    model_env: SCENARIO_MODEL
    api_key_env: SCENARIO_API_KEY
  artifact_llm:
    base_url_env: ARTIFACT_BASE_URL
    model_env: ARTIFACT_MODEL
    api_key_env: ARTIFACT_API_KEY
  target:
    base_url_env: TARGET_BASE_URL
    model_env: TARGET_MODEL
    api_key_env: TARGET_API_KEY
  judge:
    base_url_env: JUDGE_BASE_URL
    model_env: JUDGE_MODEL
    api_key_env: JUDGE_API_KEY

# Retrieval for the Policy Mapper. OPTIONAL — the defaults below are local
# CPU models (downloaded on first use; policy text stays on your machine).
# To use a remote embedding endpoint instead, set bi_encoder_model to the
# endpoint URL, bi_encoder_model_name to the served model, and
# bi_encoder_api_key_env to the env var holding its key (policy chunk text
# is then sent to that provider — it appears in the data-flow table).
retrieval:
  bi_encoder_model: all-mpnet-base-v2
  cross_encoder_model: cross-encoder/ms-marco-MiniLM-L-12-v2
  # bi_encoder_model: https://embeddings.example.com/v1
  # bi_encoder_model_name: text-embedding-3-large
  # bi_encoder_api_key_env: EMBEDDING_API_KEY
  # cross_encoder_type: score   # score | rerank | generative

scope:
  # null = all mapped risks; or list explicit risk IDs after reviewing the
  # mapper output (recorded as an input adaptation).
  risk_ids: null
  generation_mode: coverage
  max_scenarios_per_pattern: 2
  max_artifacts: 3
  target_samples_per_artifact: 1
  # Optional upper bound for one stage attempt, in seconds. null (default)
  # means no deadline: a slow local endpoint may take hours. Set a number
  # only if the user asked for a time limit; the runner will kill the stage
  # at that point and retain partial evidence.
  stage_deadline_seconds: null

options:
  ocr: false
  # OPTIONAL: reviewed, typed tool schemas for replay entries (JSON with a
  # top-level "tools" list of OpenAI function-tool objects). Copied into the
  # run at new-run and validated at preflight. When supplied, the artifact's
  # own system-turn declarations must name exactly the same tools; the
  # reviewed schemas provide the parameter types. Without it, schemas are
  # derived from the artifact's explicit declarations only (untyped
  # parameters stay unconstrained).
  # tools_schema_file: system/tool-schemas.json

  # OPTIONAL: lower the Policy Mapper's parallel model calls (the component
  # default is 32). Use this under network or provider rate-limit pressure;
  # it trades throughput for a gentler request pattern. null = component
  # default.
  # mapper_max_concurrent: 4

  # OPTIONAL: Scenario Generator wire-schema mode. "strict" strips
  # validation-only JSON Schema keywords for OpenAI-strict validators while
  # the component still validates locally; null/native keeps the component
  # default.
  # scenario_json_schema_compat: strict

telemetry:
  # Runner/stage spans via standard OTEL_* settings (OTEL_EXPORTER_OTLP_ENDPOINT).
  enabled: true
