[project]
name = "asago-runner"
version = "0.1.0"
description = "Runner for the Asago pipeline: policy documents to evaluated results (evaluation currently through Garak)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    # Real Asago components, pinned to immutable commits (see
    # references/compatibility-record.md for status and provenance).
    "asago-policy-mapper @ git+https://github.com/blastStu/asago-policy-mapper.git@daf1e1b099392855e1ec9405d80f3bca19c3bf06",
    "asago-scenario-generator @ git+https://github.com/blastStu/asago-scenario-generator.git@0f9a6aa1b7db0b2dc3a1a2fb38482618fd41484f",
    "asago-artifact-generator @ git+https://github.com/asago-ai/asago-artifact-generator.git@8f481944fd7abd72cd131c14ee9ab366d8d98372",
    # Runner-owned dependencies.
    "typer>=0.12",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[project.scripts]
asago-runner = "asago_runner.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asago_runner"]

[tool.hatch.metadata]
# The component pins above are direct git references.
allow-direct-references = true

[tool.uv]
# The Policy Mapper declares `ai-atlas-nexus @ ...@main`, which floats. The
# runner pins the exact commit that the pinned mapper revision's own uv.lock
# validated (c7a5304..., package 1.2.5) so the installed library, its bundled
# data and the runner-managed data cache are one deliberate combination.
# Preflight resolves and verifies the *effective* installed dependency rather
# than trusting this declaration.
override-dependencies = [
    "ai-atlas-nexus @ git+https://github.com/IBM/ai-atlas-nexus.git@c7a53040c45761376993386b0416a2b977591426",
]
