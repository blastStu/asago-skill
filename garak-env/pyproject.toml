[project]
name = "asago-garak-env"
version = "0.1.0"
description = "Isolated Garak environment for the Asago runner (pinned trustyai-explainability fork, PR #11)"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = [
    # Garak fork supplying probes.injection.IndirectInjection and
    # detectors.injection_judge.InjectionJudge. PR #11 head, open/unmerged at
    # adoption; pinned to the immutable commit inspected in the plan.
    "garak @ git+https://github.com/trustyai-explainability/garak.git@06aba1a2c9b142d561eeeff08dfaffcbe77487c3",
]

# This environment is separate from the runner/Asago environment because the
# Garak fork and the Policy Mapper have disjoint version constraints
# (e.g. numpy, transformers). The two environments exchange files only.
